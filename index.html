<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="面向海外路桥工程管理人员的工程 AI 提示词库，支持提示词搜索、分类筛选和一键复制。">
  <title>工程 AI 提示词库</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <p class="eyebrow">Engineering AI Prompt Library</p>
      <h1>工程 AI 提示词库</h1>
      <p class="header-summary">面向海外路桥工程人员，沉淀合同分析、成本分析、监理英文沟通、Civil 3D 学习、汇报材料写作和工程三维可视化等高频工作提示词。</p>
      <div class="header-notes" aria-label="产品特点">
        <span>静态网页</span>
        <span>本地可用</span>
        <span>一键复制</span>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section class="toolbar" aria-labelledby="library-tools-title">
      <div class="section-heading">
        <p class="section-kicker">提示词检索</p>
        <h2 id="library-tools-title">按关键词或工作类型快速定位</h2>
      </div>

      <label class="search-box" for="searchInput">
        <span class="search-label">搜索提示词</span>
        <input type="search" id="searchInput" placeholder="搜索标题、适用场景或提示词正文，例如：索赔、油耗、催批复、横断面" autocomplete="off">
      </label>

      <div class="category-section" aria-label="提示词分类筛选">
        <button class="category-btn active" type="button" data-category="all">全部</button>
        <button class="category-btn" type="button" data-category="contract">合同分析</button>
        <button class="category-btn" type="button" data-category="cost">成本分析</button>
        <button class="category-btn" type="button" data-category="consultant">监理英文沟通</button>
        <button class="category-btn" type="button" data-category="civil3d">Civil 3D 学习</button>
        <button class="category-btn" type="button" data-category="report">汇报材料</button>
        <button class="category-btn" type="button" data-category="visualization">工程三维可视化</button>
      </div>

      <p class="result-status" id="resultStatus" aria-live="polite"></p>
    </section>

    <section class="prompt-grid" id="promptGrid" aria-label="提示词卡片列表"></section>

    <section class="empty-state hidden" id="emptyState" aria-live="polite">
      <h2>没有找到匹配的提示词</h2>
      <p>请尝试更换关键词，或点击“全部”查看完整列表。</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>工程 AI 提示词库｜为海外工程管理、商务合同、成本控制和技术学习场景提供可复制的工作模板。</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
